[project]
name = "write-ai-agent"
version = "2.0.0"
description = "AI-powered novel writing pipeline with multi-agent orchestration"
requires-python = ">=3.11"
dependencies = [
    # LLM providers
    "boto3>=1.34",
    "openai>=1.30",
    "anthropic>=0.30",
    "tiktoken>=0.7",
    # Data & Storage
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "networkx>=3.2,<4",
]

[project.optional-dependencies]
semantic = [
    "chromadb>=0.5,<2",
    "sentence-transformers>=3,<7",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["config*", "memory*", "infrastructure*", "scripts*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: opt-in model/service integration tests (NOVEL_TEST_SEMANTIC or NOVEL_TEST_JEV_LIVE)",
]
